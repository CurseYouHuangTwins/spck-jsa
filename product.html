<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

</head>

<body>
    <div class="container card">
        <div id="product" class="row">
            <div class="col-6 product-col">
                <div id="carouselStacked" class="carousel slide card">
                    <div class="d-flex justify-content-between align-items-center  product-col">
                        <div>
                            <button class="btn-icon btn-sm" type="button" data-bs-target="#carouselStacked" data-bs-slide="prev">
                    <span class="carousel-icon-prev" aria-hidden="true"></span>
                    <span class="visually-hidden">Previous</span>
                </button>
                            <button class="btn-icon btn-sm" type="button" data-bs-target="#carouselStacked" data-bs-slide="next">
                    <span class="carousel-icon-next" aria-hidden="true"></span>
                    <span class="visually-hidden">Next</span>
                </button>
                        </div>
                        <div class="carousel-indicators" id="product-indicator">
                            <button type="button" data-bs-target="#carouselStacked" data-bs-slide-to="0" class="active" aria-current="true" aria-label="Slide 1"></button>
                        </div>
                    </div>
                    <div class="carousel-inner rounded-5" id="carousel">
                        <div class="carousel-item active">
                            <img id="carousel-one" src="https://thumbs.dreamstime.com/b/bold-red-triangle-exclamation-mark-symbolizing-caution-alertness-red-warning-triangle-exclamation-mark-safety-365565643.jpg" class="d-block w-100 gallery" alt="...">
                        </div>
                    </div>
                </div>
                <div>
                    <div id="badges">

                    </div>
                    <div class="product-specifications">
                        <div class="spec-tabs-scrollbar" id="specTabsScrollbar" role="scrollbar" aria-label="Scroll product specification tabs" aria-controls="myTab" aria-orientation="horizontal" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" tabindex="0" hidden>
                            <div class="spec-tabs-scrollbar-thumb" id="specTabsScrollbarThumb"></div>
                        </div>
                        <ul class="nav nav-tabs" id="myTab" role="tablist" aria-label="Product specifications">
                        </ul>
                        <div class="tab-content" id="myTabContent">
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-6 product-col">
                <h1 id="product-name">Product not found!</h1><br>
                <p id="contents">Product not found!</p>
                <h1>Multimedia</h1>
                <div id="multimedia">
                    
                    <ul class="nav nav-tabs" id="myTabM" role="tablist" aria-label="Product specifications">
                    </ul>
                    <div class="tab-content" id="myTabContentM">
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="container">
        <h1>Products similar to this</h1>
        <div id="similar" class="row"></div>
    </div>
    <dialog class="dialog" id="exampleDialog">
        <div class="dialog-header">
            <h1 class="dialog-title" id="dialog-title">Info</h1>
            <button type="button" class="btn-close" data-bs-dismiss="dialog" aria-label="Close"></button>
        </div>
        <div class="dialog-body" id="dialog-badges">
            <p>Why are you accessing this?</p>
        </div>
        <div class="dialog-footer">
            <button type="button" class="btn-solid theme-secondary" data-bs-dismiss="dialog">Close</button>
        </div>
    </dialog>
    <script type="module" src="scripts/product.js"></script>
</body>

</html>
